[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-evidence-packager"
version = "0.0.0"
description = "Build coverage-aware IOC investigations and portable, verifiable evidence handoffs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "saltyma" }]
dependencies = ["Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ioc_evidence_packager"]
mypy_path = "src"
