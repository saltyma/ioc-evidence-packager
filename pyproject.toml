[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-evidence-packager"
version = "0.8.1"
description = "Build coverage-aware IOC investigations and portable, verifiable evidence handoffs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "saltyma" }]
license = "MIT"
dependencies = [
  "Jinja2>=3.1,<4",
  "reportlab>=4.4,<6",
  "PySide6>=6.8,<7",
]

[project.scripts]
ioc-capsule = "ioc_evidence_packager.capsule_cli:main"

[project.gui-scripts]
ioc-evidence-packager = "ioc_evidence_packager.presentation.desktop.app:main"

[tool.setuptools]
include-package-data = false

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7", "build>=1.2,<2"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ioc_evidence_packager.presentation.desktop" = [
  "assets/*.png",
  "assets/*.ico",
  "assets/*.svg",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ioc_evidence_packager"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
